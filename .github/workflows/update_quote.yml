name: Weekly Letterboxd Quote Update

on:
  schedule:
    - cron: '0 0 * * 0' # Runs Sunday at midnight UTC
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
          
      - name: Run Extraction Engine
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python update_quote.py
        
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: automated 5/5 movie quote update [skip ci]"
          git push
